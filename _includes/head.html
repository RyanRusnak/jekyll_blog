<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">

{% comment %}
  Favicon: JetBrains Mono ExtraBold "R" in the gruvbox accent, baked to PNG so
  the letterform is identical everywhere rather than falling back to whatever
  monospace a visitor happens to have. Regenerate with script/make_favicon.sh
{% endcomment %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/favicon-512.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    var t = localStorage.getItem("omarchy-theme") || "{{ site.default_theme | default: 'gruvbox' }}";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
