<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
  {% include header.html %}
  <main>{{ content }}</main>
  {% include statusbar.html %}
  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <div class="palette-head"><span>theme</span><span class="dim">SUPER + CTRL + SPACE</span></div>
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  {% if page.search %}<script src="{{ '/assets/js/search.js' | relative_url }}"></script>{% endif %}
  {% if page.mermaid %}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    mermaid.initialize({ startOnLoad: true, theme: "dark", themeVariables: { background: dark, fontFamily: "JetBrains Mono, monospace" } });
  </script>
  {% endif %}
  {% if page.math %}
  <script>
    // kramdown already turned the markdown into \( \) and \[ \] — all that is
    // missing is something to render them. Loaded only on pages with math.
    // Obsidian writes inline math as $…$, which kramdown leaves alone (it only
    // treats $$…$$ as math), so MathJax has to accept single dollars too.
    // processEscapes lets a literal dollar be written \$ if a post needs one.
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
  {% if site.goatcounter != "" and jekyll.environment == "production" %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
  {% endif %}
</body>
</html>
